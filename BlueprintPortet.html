<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body {
       font-family: Arial, sans-serif;
       margin: 20px;
   }
   /*
   .page-body {
       height: 98vh;
       display: flex;
       justify-content: center;
       align-items: center;
       background-color: #f4f4f4;
   } */

   .Container {
       margin: 0 auto;
       padding: 20px;
       border: 1px solid #ddd;
       border-radius: 8px;
       min-width: 50%;
       width: 60%;
       height: 90vh;
       display: flex;
       justify-content: center;
       align-items: center;
       flex-direction: row;
       border: 2px solid #9005fa;

         }

   .main-page-container {

   .main-page-heading {

   .main-container {

   .tab-button {

   }


   .blueprint-heading {
       font-size: 24px;

     }

   input[type="text"] {
       width: calc(100% - 20px);

   }

   button:hover {

   .output {

       display: flex;

   .output pre {
       background-color: #f8f9fa;
       padding: 15px;

       overflow-x: auto;
   }

   .status-box {
        padding: 8px 16px;
       margin-top: 20px;
       margin-bottom: 2px;
       font-size: 12px;
       border-radius: 5px;
       display: inline-block;
       background-color: #ffffff;
       color: #000;
       transition: all 0.3s ease;

   }

   .status-success {
       background-color: #28a745;

   }

       background-color: #dc3545;

   }

   .status-client-error {

   }

   .status-warning {
       background-color: #ffc107;
       color: black;
   }

   .status-server-error {

   #Req {
       width: 150px;
       padding: 8px;
       font-size: 14px;
       border: 1px solid #ccc;
       border-radius: 4px;
       background-color: #f9f9f9;

       transition: border-color 0.3s ease, box-shadow 0.3s ease;
   }

   #Req:focus {
       border-color: #757f8a;
       outline: none;
       box-shadow: 0 0 4px rgba(236, 240, 244, 0.5);
   }

   .field-container {
       display: flex;
       align-items: center;
   }

   .field-container input {
       flex: 1;
       margin-right: 5px;
   }

   .remove-button {
       background-color: #dc3545;
       color: white;
       border: none;
       border-radius: 4px;
       cursor: pointer;
       padding: 5px 10px;
   }

   .remove-button:hover {
       background-color: #c82333;
   }

   .action-buttons {
       display: flex;
       justify-content: space-between;
       align-items: center;
       margin-top: 10px;
   }

   .action-buttons button {
       margin-left: 5px;
   }

   .iframe-container {
       position: relative;
       width: 100%;
       padding-bottom: 56.25%;
       height: 0;
       overflow: hidden;
   }

   .iframe-container iframe {
       position: absolute;
       top: 0;
       left: 0;
       width: 100%;
       height: 100%;
   }

   .loader {
       animation: spin 0.6s linear infinite;
   }

   @keyframes spin {
       0% {
           transform: rotate(0deg);
       }

       100% {
           transform: rotate(360deg);
       }
   }

   .path {
       stroke: #3498db;
   }

   .json-output {
       font-family: "Courier New", monospace;
       white-space: pre-wrap;
       word-wrap: break-word;
       padding: 15px;
       border: 1px solid #ddd;

       margin-top: 20px;

   .plain-response {

   .select-blueprint-name {

   }

   .text-area {

       font-size: 14px;
       resize: vertical;
       max-height: 20vh;
       overflow-y: auto;

     }

   }

   .tabs {

   #Body {
       display: none;
   }

   .response-action-container {

   }

   .blueprint-name-edit-container {

   }

<body class="page-body">
<!-- Main page content with buttons -->
<div id="mainPage" class="Container">
    <p class="support-version">Support Version: 16.2.3.1153 01 34</p>
    <div class="main-page-container">
        <h2 class="main-page-heading">Choose Operation Type</h2>
        <div>
            <button onclick="showRestSection()" class="front-page-button tab-button">REST</button>
            <button onclick="showBlueprintSection()" class="front-page-button tab-button">Blueprint</button>
        </div>
    </div>
</div>
<!-- REST Section -->
<div id="restSection" class="Container" style="display: none;">
    <div id="restContainer" style="display: block;">
        <label>
            <input type="checkbox" id="clarity" checked="true" /> Relative-Path
        </label>
        <div style="padding: 3">
            <select name="Request" id="Req">
                <option value="Get" class="option-get">GET</option>
                <option value="Put" class="option-put">PUT</option>
                <option value="Delete" class="option-delete">DELETE</option>
                <option value="Post" class="option-post">POST</option>
                <option value="Patch" class="option-patch">PATCH</option>
            </select>
            <input type="text" placeholder="URL" id="input" style="width: 500px" />
            <button onclick="input()" class="tab-button">SEND</button>
        </div>
        <br />
        <div class="tabs">
            <button class="tab-button" onclick="openTab('Body')">Body</button>
            <button class="tab-button" onclick="openTab('Headers')">Headers</button>
            <button class="tab-button" onclick="openTab('Params')">Params</button>
            <button class="tab-button" onclick="clearRequest()">
                Clear Req
            </button>
            <button id="hideBtn" class="tab-button" onclick="hideRestContainer()"
                    style="display: none; width: 120px">Hide Request</button>

        </div>
    </div>
    <br />
    <div id="sectionData" class="input-section-container">
        <div id="Body" class="tab-content">
            <select name="scrip" id="scp" class="input-option">
                <option value="Json" id="drop">Json</option>
            </select>
            <textarea id="json" rows="10" cols="100" style="overflow: auto" spellcheck="false" class="text-area"
                      required></textarea>
            <button id="runButton" class="tab-button custom-btn" onclick="copyBlueprint()" style="display: none;">
                Run
            </button>
        </div>
        <div id="Headers" class="tab-content" style="display: none;">
            <h3>Header</h3>
            <div id="headers-container">
                <div class="field-container">
                    <input type="text" placeholder="key" class="header-key" id="headkey" />
                    <input type="text" placeholder="value" class="header-value" id="headval" />
                    <button class="remove-button" onclick="removeField(this, 'headers-container')">
                        Remove
                    </button>
                </div>
            </div>
            <div class="action-buttons">
                <button onclick="addHeaderField()">Add Header</button>
            </div>
        </div>
        <div id="Params" class="tab-content" style="display: none">
            <h3>Param</h3>
            <div id="params-container">
                <div class="field-container">
                    <input type="text" placeholder="key" class="param-key" />
                    <input type="text" placeholder="value" class="param-value" />
                    <button class="remove-button" onclick="removeField(this, 'params-container')">
                        Remove
                    </button>
                </div>
            </div>
            <div class="action-buttons">
                <button onclick="addParamField()">Add Param</button>
            </div>
        </div>
    </div>
    <div class="output" style="padding: 1%; padding-left: 0">
        <div class="response-action-container">
            <button class="tab-button custom-btn" onclick="copyResponse()">
                Copy Response
            </button>
            <button class="tab-button custom-btn" onclick="clearResponse()">
                Clear Response
            </button>
        </div>
        <div id="statusBox" class="status-box"></div>
        <textarea id="Out" rows="30" cols="100" style="overflow: auto" spellcheck="false"
                  class="text-area text-area-response out-textarea" readonly></textarea>
        <button onclick="goBackToMain()" class="tab-button" style="width: 150px; margin-top: 10px;">Return To Main
            Page</button>
    </div>
</div>
</div>

<!-- Blueprint Section -->
<div id="blueprintSection" class="Container" style="display: none;">
    <h2 class="blueprint-heading">Blueprint Operations</h2>
    <input type="hidden" id="blueprintActionType" value="" />
    <div id="blueprintOptions">
        <button class="tab-button" onclick="showCopyBlueprint('Create')">Create</button>
        <button class="tab-button" onclick="showCopyBlueprint('Update')">Update</button>
        <button class="tab-button" onclick="getAllBlueprint()">Get All</button>

        <button class="tab-button" onclick="renameBlueprint()">Rename</button>

    <div id="blueprintBody" class="tab-content">
        <select name="scrip" id="scp" class="input-option">

    <div id="getAllBlueprintContainer" class="get-all-blueprints-container" style="display: none;">

            <br />

            <div>
                <label><input type="checkbox" name="publishedBy" value="publishedBy" class="option" /> Published
                    By</label>
                <label><input type="checkbox" name="lastPublishedDate" value="lastPublishedDate" class="option" />
                    Last
                    Published Date</label>
                <label><input type="checkbox" name="lastUpdatedBy" value="lastUpdatedBy" class="option" /> Last
                    Updated
                    By</label>
                <label><input type="checkbox" name="lastUpdatedDate" value="lastUpdatedDate" class="option" /> Last
                    Updated
                    Date</label>

    <div id="BlueprintRenameContainer" class="tab-content" style="display: none">

        <div id="Blue-container">

                <input type="text" placeholder="Enter your blueprint id..." id="BlueprintIdRename" />
            </div>
            <div class="field-container">
                <input type="text" placeholder="Enter Name" id="NameBlue" />
            </div>
            <button class="tab-button" onclick="EditNameBlue()" style="background-color: rgb(4, 175, 4)">

            </button>

    <div class="output" style="padding: 1%; padding-left: 0">
        <div class="response-action-container">
            <button class="tab-button custom-btn" onclick="copyResponse()">
                Copy Response
            </button>
            <button class="tab-button custom-btn" onclick="clearResponse()">
                Clear Response
            </button>

        <div id="statusBox" class="status-box"></div>

    <button id="backToMainBlueprint" onclick="goBackToMain()" class="tab-button"

<script>
    url = "";
   headers = {};
   params = {};
   ans = "";
   display = true;
   blueprintId = null;

   //Main Page

   function hideAllSections() {
       const sections = document.querySelectorAll('.section');
       sections.forEach(section => section.style.display = 'none');
   }

   function showRestSection() {
       document.getElementById("mainPage").style.display = 'none';
       document.getElementById("restSection").style.display = 'block';
   }

   function showBlueprintSection() {
       document.getElementById("mainPage").style.display = 'none';
       document.getElementById("blueprintSection").style.display = 'block';
   }

   function goBackToMain() {
       document.getElementById("restSection").style.display = 'none';
       document.getElementById("blueprintSection").style.display = 'none';
       document.getElementById("mainPage").style.display = 'flex';
   }

   //REST PAGE



   function copyResponse() {
       const responseTextAreas = document.querySelectorAll(".out-textarea");
       const visibleTextarea = Array.from(responseTextAreas).find(textarea => textarea.offsetParent !== null);
      // const responseText = document.getElementById("out-textarea");
       if (visibleTextarea.value.trim() === "") {
           alert("Textarea is empty. Nothing to copy.");
           return;
       }
       visibleTextarea.select();
       visibleTextarea.setSelectionRange(0, 99999);
       try {
           const successful = document.execCommand("copy");
           if (successful) {
               alert("Text copied to clipboard!");
           } else {
               alert("Failed to copy text.");
           }
       } catch (err) {
           console.error("Failed to copy text:", err);
           alert("Failed to copy text.");
       }
   }

   function clearResponse() {
       const allTextAreas = document.querySelectorAll(".out-textarea");
       allTextAreas.forEach((textarea) => {
           const isVisible = textarea.offsetParent !== null;
           if (isVisible) {
               textarea.value = "";
           }
       });
       const statusBoxes = document.querySelectorAll(".status-box");
       const visibleBox = Array.from(statusBoxes).find(
           (box) => box.offsetParent !== null
       );

       if (visibleBox) {
           visibleBox.textContent = "";
           visibleBox.className = "status-box";
       }
   }

   function clearRequest() {
       document.getElementById("headers-container").innerHTML = "";
       document.getElementById("params-container").innerHTML = "";
       document.getElementById('input').value = null;
       document.getElementById('json').value = null;
   }

   function checkAll(check) {
       const checkboxes = document.querySelectorAll(".option");
       checkboxes.forEach((checkbox) => {
           checkbox.checked = check;
       });
   }

   function Prop() {
       const ID = document.getElementById("BlueprintId").value;
       url = "private" + "/blueprintData/" + (ID === "" ? blueprintId : ID);
       console.log("Properties - " + url);
       input();
   }

   //Blueprint PAGE

   async function getBlueprints() {
       url =
           window.location.origin +
           "/ppm/rest/v1/private/blueprints/?fields=name,type,blueprintLevel,mode,isDefault,isSystem,publishedBy,lastPublishedDate,lastUpdatedBy,lastUpdatedDate,classifier,_isFavorite&filter=((isPrivate+=+false)+and+(mode+=+'PUBLISHED')+and+(blueprintLevel+=+1))&limit=100&tsvParams=(workEffortUnit=hours)";
       const header = new Headers();
       const sessionCookie = readSessionCookie();
       header.append("Authtoken", sessionCookie);
       header.append("Content-Type", "application/json");
       for (const key in headers) {
           if (headers[key]) {
               header.append(key, headers[key]);
           }
       }
       const response = await fetch(url, {
           method: "GET",
           headers: header,
       });
       const data = await response.json();
       const results = data._results || [];
       console.log("Results: ", results);
       const selectBlueprintElement = document.getElementById("selectBlueprint");
       selectBlueprintElement.innerHTML = "";
       const defaultOption = document.createElement("option");
       defaultOption.value = "";
       defaultOption.disabled = true;
       defaultOption.selected = true;
       defaultOption.textContent = "Select a blueprint";
       selectBlueprintElement.appendChild(defaultOption);
       results.forEach((eachBlueprint) => {
           const newOption = document.createElement("option");
           newOption.value = eachBlueprint._internalId;
           newOption.text = eachBlueprint.name;
           selectBlueprintElement.appendChild(newOption);
       });

       console.log(`Getting blueprints ${data}`);
     url = "";
   }

   getBlueprints();

   function getBlueprintId(event) {
       blueprintId = event.target.value;
       console.log(blueprintId);
   }

   function hideRestContainer() {
       const restBody = document.getElementById("Body")
       const headers = document.getElementById("Headers")
       const params = document.getElementById("Params")
       const hideButton = document.getElementById("hideBtn")
       restBody.style.display = "none"
       headers.style.display = "none"
       params.style.display = "none"
       hideButton.style.display = "none"

   }

   function Visuals() {
       const ID = document.getElementById("BlueprintId").value;
       url =
           "private/availableVisuals?filter=(( blueprintType = PROJECT ) and ( category = VISUAL ) and ( blueprintId = " +
           (ID === "" ? blueprintId : ID) +
           " ))";
       console.log("Visuals - " + url);
       input();
   }

   function Rules() {
       const ID = document.getElementById("BlueprintId").value;
       url =
           "private/rules?fields=name,isActive,description,lastUpdatedBy,lastUpdatedDate,objectCode&filter=(associatedInstanceId = " +
           (ID === "" ? blueprintId : ID) +
           ")";
       console.log("Rules - " + url);
       input();
   }

   function Actions() {
       const ID = document.getElementById("BlueprintId").value;
       url =
           "private/actionAssociations?fields=sequence,name,code,isActive,processVersionId&filter=(blueprintId = " +
           (ID === "" ? blueprintId : ID) +
           ")";
       console.log("Properties - " + url);
       input();
   }

   function fetchBlueprintById() {
       const ID = blueprintId;
       if (!ID) alert("Please enter the ID for fetching Blueprint");

   function readSessionCookie() {
       const name = "sessionId=";
       const getCookie = decodeURIComponent(document.cookie);
       const ca = getCookie.split(";");
       for (let i = 0; i < ca.length; i++) {
           let c = ca[i];
           while (c.charAt(0) == " ") {
               c = c.substring(1);
           }
           if (c.indexOf(name) == 0) {
               return c.substring(name.length, c.length);
           }
       }
       return "";
   }

   function makeRequest(method) {
       let body = null;
       if (method !== "GET") {
           body = document.getElementById("json").value;
           if (body) {
               try {
                   body = JSON.parse(body);
               } catch (e) {
                   console.error("Invalid JSON format");
                   body = null;
               }
           }
       }
       const header = new Headers();
       const sessionCookie = readSessionCookie();
       header.append("Authtoken", sessionCookie);
       header.append("Content-Type", "application/json");
       for (const key in headers) {
           if (headers[key]) {
               header.append(key, headers[key]);
           }
       }

       fetch(url, {
           method: method,
           headers: header,
           body: method !== "GET" && body ? JSON.stringify(body) : null,
       })
           .then((response) => {
               if (!response.ok) {
                   return response.json().then((errorData) => {
                       const {
                           resourceId = null,
                           httpStatus = response.status,
                           errorMessage,
                           errorCode,
                       } = errorData;
                       const formattedError = {
                           resourceId,
                           httpStatus,
                           errorMessage,
                           errorCode,
                       };
                       console.log("Error response data:", formattedError);
                       updateStatusBox(formattedErro?.httpStatus);
                       return formattedError;
                   });
               }
               const contentType = response.headers.get("content-type");
               if (contentType && contentType.includes("application/json")) {
                   updateStatusBox(200);
                   return response.json();
               }
           })
           .then((data) => {
               updateStatusBox(200)
               updateResponse(JSON.stringify(
                   data,
                   null,
                   4
               ));
               ans = JSON.stringify(data, null, 4);
           })
           .catch((error) => {
               console.error("Fetch error:", error);
               document.getElementById("Out").innerText =
                   "Error: " + error.message;
               const errored_output = {
                   resourceId: null,
                   httpStatus: 400,
                   errorMessage: error.message,
                   errorCode: "FETCH_ERROR",
               };
               updateStatusBox(errored_output.httpStatus)
               updateResponse(JSON.stringify(
                   errored_output,
                   null,
                   4
               ));
           });
   }

   function updateStatusBox(statusCode) {
       const boxes = document.querySelectorAll(".status-box");
       const visibleBox = Array.from(boxes).find(
           (box) => box.offsetParent !== null
       );

       if (!visibleBox) return;


       visibleBox.className = "status-box";
       visibleBox.textContent = `Status: ${statusCode}`;


       if (statusCode >= 200 && statusCode < 300) {
           visibleBox.classList.add("status-success");
       } else if (statusCode >= 400 && statusCode < 500) {
           visibleBox.classList.add("status-client-error");
       } else if (statusCode >= 500) {
           visibleBox.classList.add("status-server-error");
       }
   }

   async function fetchBlueprintDetails() {

               }

       }

       const header = new Headers();
       const sessionCookie = readSessionCookie();
       header.append("Authtoken", sessionCookie);
       header.append("Content-Type", "application/json");

       for (const key in headers) {
           if (headers[key]) {
               header.append(key, headers[key]);
           }
       }

       const response = await fetch(
           urlWithoutId + "private/blueprintData/" + blueprintId,
           {
               method: "GET",
               headers: header,
           }
       );

       const visualData = await fetchData(url + "/visuals/", header);

       const detailedVisuals = await Promise.all(
           visualData._results.map(async (visual) => {
               const visualDetails = await fetchData(
                   url + "/visuals/" + visual._internalId,
                   header
               );
               return visualDetails;
           })
       );

       const rulesData = await fetchData(
           urlWithoutId +
           "private/rules?fields=name,isActive,description,lastUpdatedBy,lastUpdatedDate,objectCode&filter=(associatedInstanceId = " +
           blueprintId +
           ")",

       const actionData = await fetchData(
           urlWithoutId +
           "private/actionAssociations?fields=sequence,name,code,isActive,processVersionId&filter=(blueprintId = " +
           blueprintId +
           ")",
           header
       );
       const bluePrintDetails = await fetchData(url, header);
       const standardBlueprintId = bluePrintDetails.standardBlueprintId;

       }
       let data = await response.json();
       data = {
           standardBlueprintId: standardBlueprintId,
           blueprintId: blueprintId,
           ...data,
           visuals: detailedVisuals,
           rules: rulesData._results,

       };
       console.log("data", data);
